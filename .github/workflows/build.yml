name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BudsBattery.apk
          cp dashboard/build/outputs/apk/debug/dashboard-debug.apk CrimsonWidget.apk
          cp icons/build/outputs/apk/debug/icons-debug.apk CrimsonIcons.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BudsBattery-apk
          path: BudsBattery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonWidget-apk
          path: CrimsonWidget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonIcons-apk
          path: CrimsonIcons.apk

      # A fixed download link you can open straight from your phone.
      - name: Publish latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest builds
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            BudsBattery.apk
            CrimsonWidget.apk
            CrimsonIcons.apk
