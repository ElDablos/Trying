name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BudsBattery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BudsBattery-apk
          path: BudsBattery.apk

      # A fixed download link you can open straight from your phone.
      - name: Publish latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Buds Battery (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: BudsBattery.apk
